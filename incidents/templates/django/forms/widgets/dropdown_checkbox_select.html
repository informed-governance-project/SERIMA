<select id="{{ widget.name }}"  class="multiselectcheckbox" name="{{ widget.name }}" aria-hidden= "true" {% include "django/forms/widgets/attrs.html" %} multiple="multiple">
    {% for group_name, group_choices, group_index in widget.optgroups %}
        {% if group_name %}
        <optgroup label="{{ group_name }}">
        {% endif %}
    {% for option in group_choices %}
        {% include option.template_name with widget=option %}
    {% endfor %}
        {% if group_name %}
        </optgroup>
        {% endif %}
    {% endfor %}
</select>
