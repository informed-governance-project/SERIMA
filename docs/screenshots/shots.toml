  { action = "click", selector = "#column-3" },
  { action = "click", selector = "#column-4" },
  { action = "click", selector = "#column-5" },
  { action = "click", selector = "#column-8" },
  { action = "click", selector = "#IncidentshideColumns .btn-close" },
  { action = "wait_ms", value = 500 },
]
annotate = [
  { selector = "th[data-sort-field='status']", arrow = "bottom", length = 45, label = "1" },
  { selector = "th[data-sort-field='last_update']", arrow = "bottom", length = 45, label = "2" },
  { selector = "th[data-sort-field='notification_date']", arrow = "bottom", length = 45, label = "3" },
  { selector = "th[data-sort-field='detection_date']", arrow = "bottom", length = 45, label = "4" },
  { selector = "th[data-sort-field='starting_date']", arrow = "bottom", length = 45, label = "5" },
  { selector = "th[data-sort-field='resolution_date']", arrow = "bottom", length = 45, label = "6" },
  { selector = "th[data-sort-field='regulator']", arrow = "bottom", length = 45, label = "7" },
  { selector = "th[data-sort-field='regulation']", arrow = "bottom", length = 45, label = "8" },
  { selector = "th[data-sort-field='reference']", arrow = "bottom", length = 45, label = "9" },
  { selector = "th[data-sort-field='sectors']", arrow = "bottom", length = 45, label = "10" },
