# --- Fill in a report (docs/incident-notification/fill-in-a-report.rst) ------
#
# The list shots show the Reference column, which the dashboard hides by
# default, and drop "Last update" as the manual's figures do. The choice is
# kept in localStorage and each click toggles it, so those shots run in a
# fresh context: in the shared one the second shot would toggle it back.
#
# The list filter is kept in the session, so every list path sets it
# explicitly: `?reset=1` for the whole list, `?search=` for one incident.
#
# The report wizard persists nothing before its last step, so the form shots
# stop short of Submit and change no data.

[[shots]]
name = "images/incident-notification/workflow-operator-01"
role = "operator_admin"
path = "/incidents/create_workflow?incident_id=36&workflow_id=1"
viewport = { width = 1440, height = 1300 }

[[shots]]
name = "images/incident-notification/workflow-operator-02"
role = "operator_admin"
path = "/incidents/create_workflow?incident_id=36&workflow_id=1"
viewport = { width = 1440, height = 900 }
steps = [
  { action = "click", selector = "#wizard-next-btn" },
  { action = "click", selector = "#id_1-__question__1_1" },
  { action = "click", selector = "#id_1-__question__37_0" },
  # Each step scrolls down to the form about half a second after loading.
  # Let that happen, then go back to the top; the scroll is smooth, so it
  # needs time too.
  { action = "wait_ms", value = 800 },
  { action = "press", selector = "#id_1-__question__37_0", key = "Home" },
  { action = "wait_ms", value = 800 },
]
# The click leaves the pointer on the box, over its field's tooltip.
hide = [".tooltip"]

[[shots]]
name = "images/incident-notification/workflow-operator-03"
role = "operator_admin"
path = "/incidents/create_workflow?incident_id=36&workflow_id=1"
viewport = { width = 1440, height = 900 }
steps = [
  { action = "click", selector = "#wizard-next-btn" },
  { action = "click", selector = "#id_1-__question__1_1" },
  { action = "click", selector = "#id_1-__question__37_0" },
  { action = "click", selector = "#wizard-next-btn" },
  { action = "fill", selector = "#id_2-__question__2", value = "The incident temporarily disrupted key internal systems, affecting real-time monitoring and automated processes. The estimated impact on essential services is moderate, as no end-users were directly affected." },
  { action = "fill", selector = "#id_2-__question__3", value = "6" },
  { action = "fill", selector = "#id_2-__question__4", value = "Resolution is expected within four hours." },
  # As in 05; Home only scrolls from a control that does not use the key
  # itself, so not from a text field.
  { action = "wait_ms", value = 800 },
  { action = "press", selector = "#id_2-__question__8_0", key = "Home" },
  { action = "wait_ms", value = 800 },
]

