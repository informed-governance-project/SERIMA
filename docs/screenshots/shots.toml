# Shot list for docs/screenshots/capture.py.
#
# `name` is the file written to docs/_static/<name>.png — it must match the
# filename the .rst files already reference, so the docs never need editing.

base_url = "http://127.0.0.1:8000"
locale = "en-GB"

[viewport]
width = 1440
height = 900

[defaults]
settle_ms = 400
hide = [
  # The footer version string would otherwise re-diff every screenshot on each
  # release, for a number the docs never refer to.
  "footer .justify-content-between > .text-end",
]
# Matches the red of the hand-drawn callouts already in the manual.
annotation_color = "#0e0acc"
# The manual is laid out around 1440px-wide figures.

# Every role has a throwaway account, written to `credentials_file` under the
# role's name by `manage.py screenshot_fixture --create`. The environment still
# overrides it when a real account is wanted instead.

[roles.operator_admin]
username_env = "SERIMA_SHOT_OPERATOR_ADMIN_USER"
password_env = "SERIMA_SHOT_OPERATOR_ADMIN_PASS"
credentials_file = ".fixture-credentials.json"
# The fixture makes this account administrator of both operators, so the
# company-selection interstitial is answered the same way every run.
company = "Operator A"

[roles.operator_user]
# An account with NO TOTP device yet — the enrolment wizard is only reachable
# while 2FA is off. See the note under the 2FA shots below.
username_env = "SERIMA_SHOT_OPERATOR_USER"
password_env = "SERIMA_SHOT_OPERATOR_PASS"
credentials_file = ".fixture-credentials.json"

[roles.regulator_admin]
username_env = "SERIMA_SHOT_REGULATOR_ADMIN_USER"
password_env = "SERIMA_SHOT_REGULATOR_ADMIN_PASS"
credentials_file = ".fixture-credentials.json"

[roles.regulator_user]
username_env = "SERIMA_SHOT_REGULATOR_USER"
password_env = "SERIMA_SHOT_REGULATOR_PASS"
credentials_file = ".fixture-credentials.json"

[roles.observer_admin]
username_env = "SERIMA_SHOT_OBSERVER_ADMIN_USER"
password_env = "SERIMA_SHOT_OBSERVER_ADMIN_PASS"
credentials_file = ".fixture-credentials.json"

[roles.platform_admin]
username_env = "SERIMA_SHOT_PLATFORM_USER"
password_env = "SERIMA_SHOT_PLATFORM_PASS"
credentials_file = ".fixture-credentials.json"

# --- Two-factor enrolment (docs/getting-started/enable-2fa.rst) -------------
#
# The wizard's "Next" is `button[type=submit]:not([name])`. A bare
# `button[type=submit]` also matches "Back", which django-two-factor-auth
# renders FIRST and only from the second step on — so it silently walks the
# wizard backwards instead of forwards.
#
# STATEFUL. The wizard only exists while the account has no TOTP device, and
# enable-2fa-04 requires actually completing it — which creates one.
# `manage.py screenshot_fixture --create` removes it again before each run.
#
# The first three shots persist nothing, so they are safe to re-run on their
# own; only enable-2fa-04 enrols the device. enable-2fa-05 shows the token
# prompt at login, which exists only once a device is enrolled — so it has to
# run after enable-2fa-04, in the order below.

[[shots]]
name = "images/getting-started/enable-2fa-01"
role = "operator_user"
path = "/account/two_factor/"

[[shots]]
name = "images/getting-started/enable-2fa-02"
role = "operator_user"
path = "/account/two_factor/setup/"

[[shots]]
name = "images/getting-started/enable-2fa-03"
role = "operator_user"
path = "/account/two_factor/setup/"
steps = [{ action = "click", selector = "button[type=submit]:not([name])" }]


[[shots]]
name = "images/getting-started/enable-2fa-04"
role = "operator_user"
path = "/account/two_factor/setup/"
steps = [
  { action = "click", selector = "button[type=submit]:not([name])" },
  { action = "totp", selector = "a[href^='otpauth:']", into = "#id_generator-token" },
  { action = "click", selector = "button[type=submit]:not([name])" },
]

[[shots]]
name = "images/getting-started/enable-2fa-05"
path = "/account/login"
# Types the credentials itself, and signs in — so it borrows them from the role
# and needs a context it cannot leak into the other anonymous shots.
credentials_from = "operator_user"
fresh = true
steps = [
  { action = "click", selector = "#with-account" },
  { action = "fill", selector = "#id_auth-username", value = "${username}" },
  { action = "fill", selector = "#id_auth-password", value = "${password}" },
  { action = "click", selector = "button.submit_login" },
]

[[shots]]
name = "images/getting-started/enable-2fa-06"
path = "/account/login"
# Types the credentials itself rather than being logged in beforehand, so it
# borrows them from the role instead of the environment.
credentials_from = "operator_user"
# Signs in through its own steps, so it needs a context it cannot leak into the
# other anonymous shots.
fresh = true
steps = [
  { action = "click", selector = "#with-account" },
  { action = "fill", selector = "#id_auth-username", value = "${username}" },
  { action = "fill", selector = "#id_auth-password", value = "${password}" },
  { action = "click", selector = "button.btn-primary.submit_login" },
  # The login token step never shows the secret, so it is read from the
  # enrolled device instead — nothing to export by hand.
  { action = "totp", into = "#id_token-otp_token" },
  # "Use backup token" also carries .submit_login, so name the primary one.
  { action = "click", selector = "button.btn-primary.submit_login" },
  # Last 2FA shot: drop the device it enrolled, so the operator_user shots
  # below log in without a token prompt.
  { action = "delete_totp" },
]

