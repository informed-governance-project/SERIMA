  { action = "click", selector = "#wizard-next-btn" },
  # The field is in the DOM before Tempus Dominus binds it, and focusing it that
  # early opens nothing.
  { action = "wait_ms", value = 1000 },
  # Typed rather than left to the calendar icon, which no longer fills in the
  # current date as the prose says, and fixed so the shot does not drift daily.
  { action = "fill", selector = "#id_4-detection_date", value = "2026-10-01 09:30" },
  # Focusing the field opened the picker before Tempus Dominus parsed the typed
  # date, which only happens on change. Closing it through the icon blurs the
  # field; reopening then shows the date selected.
  { action = "click", selector = "[data-td-toggle='datetimepicker']" },
  { action = "click", selector = "[data-td-toggle='datetimepicker']" },
  { action = "wait_for", selector = ".tempus-dominus-widget.show" },
]

