# --- Operator workflow (docs/incident-notification/operator.rst) ------------
#
# The list shots show the Reference column, which the dashboard hides by
# default, and drop "Last update" as the manual's figures do. The choice is
# kept in localStorage and each click toggles it, so those shots run in a
# fresh context: in the shared one the second shot would toggle it back.
#
# The list filter is kept in the session, so every list path sets it
# explicitly: `?reset=1` for the whole list, `?search=` for one incident.
#
# Neither wizard persists anything before its last step, so the form shots
# stop short of the final Next/Submit and change no data.

[[shots]]
name = "images/incident-notification/workflow-operator-01"
role = "operator_admin"
path = "/incidents/?reset=1"
fresh = true
viewport = { width = 1440, height = 420 }
steps = [
  { action = "click", selector = "button[data-bs-target='#IncidentshideColumns']" },
  { action = "wait_for", selector = "#IncidentshideColumns.show" },
  { action = "click", selector = "#column-1" },
  { action = "click", selector = "#column-8" },
  { action = "click", selector = "#IncidentshideColumns .btn-close" },
  { action = "wait_ms", value = 500 },
]
annotate = [{ selector = "a.btn-primary[href='/incidents/declaration']", box = true, arrow = "bottom" }]

