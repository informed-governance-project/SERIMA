# --- Security objectives dashboard (docs/security-objectives/dashboard.rst) ---
#
# The operator's dashboard. Row callouts target two fixture declarations by the
# pk on their Access Log button: 107 (Under review) and 105 (Unsubmitted). They
# are the two most recently updated, so they head the list — until
# dashboard-07 duplicates one, which pushes both down and out of the cropped
# viewports. Reload the fixture before shooting this section a second time.
#
# Column choices and the legend are kept in localStorage, filters and sort
# order in the Django session — both shared by every shot of a role. Shots
# that change any of them run `fresh`, so the next shot sees the defaults.

[[shots]]
name = "images/security-objectives/dashboard-01"
# The Modules menu is no longer rendered on the homepage, so only the tile
# route to the dashboard can be shown.
