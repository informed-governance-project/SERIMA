  { action = "click", selector = "#wizard-next-btn" },
  { action = "click", selector = "#sector_12" },
  { action = "click", selector = "#sector_15" },
  { action = "click", selector = "#wizard-next-btn" },
  # The field is in the DOM before Tempus Dominus binds it, and focusing it that
  # early opens nothing.
  { action = "wait_ms", value = 1000 },
  # Typed rather than left to the calendar icon, which no longer fills in the
  # current date as the prose says, and fixed so the shot does not drift daily.
  { action = "fill", selector = "#id_4-detection_date", value = "2026-10-01 09:30" },
  # Focusing the field opened the picker before Tempus Dominus parsed the typed
  # date, which only happens on change. Closing it through the icon blurs the
  # field; reopening then shows the date selected.
  { action = "click", selector = "[data-td-toggle='datetimepicker']" },
  { action = "click", selector = "[data-td-toggle='datetimepicker']" },
  { action = "wait_for", selector = ".tempus-dominus-widget.show" },
]

[[shots]]
name = "images/incident-notification/report-an-incident-07"
path = "/incidents/declaration"
role = "operator_admin"
# STATEFUL. Submits the wizard: every run adds two incidents for Operator A,
# one per sector, logged and announced by an opening email each. Nothing
# removes them; reload the fixture to get rid of them. They count towards
# MAX_PRELIMINARY_NOTIFICATION_PER_DAY_PER_USER, past which the wizard sends
# the account back to the list instead of opening.
# The wizard lands on the list, which keeps the search the operator shots above
# left in the session; a fresh login shows it unfiltered.
fresh = true
viewport = { width = 1440, height = 560 }
steps = [
  { action = "click", selector = "#id_0-is_technical_the_same" },
  { action = "click", selector = "#wizard-next-btn" },
  { action = "click", selector = "#id_1-regulations_0" },
  { action = "click", selector = "#id_1-regulations_1" },
  { action = "click", selector = "#wizard-next-btn" },
  { action = "click", selector = "#id_2-regulators_0" },
  { action = "click", selector = "#wizard-next-btn" },
  { action = "click", selector = "#sector_12" },
  { action = "click", selector = "#sector_15" },
  { action = "click", selector = "#wizard-next-btn" },
  { action = "fill", selector = "#id_4-detection_date", value = "2026-10-01 09:30" },
  { action = "click", selector = "#wizard-next-btn" },
  # Two sectors make two incidents, and with more than one the wizard returns
  # to the list rather than opening the first report.
  { action = "wait_for", selector = "#incidents-table" },
]
# The list sorts by last update, newest first, so the two just created lead it.
annotate = [
  { selector = "#incidents-table tbody tr:nth-child(1) td.list-sectors li", box = true },
  { selector = "#incidents-table tbody tr:nth-child(2) td.list-sectors li", box = true },
]

