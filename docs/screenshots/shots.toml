# --- Incident dashboard (docs/incident-notification/dashboard.rst) ----------
#
# The operator's dashboard. Row callouts target the fixture incident NI_ZDTBC16Y
# (pk 47): both its reports have versions and it carries access-log entries. It
# is the most recently updated incident in the fixture, so it heads the
# dashboard — but only until a shot creates an incident, which would push it
# down and out of the cropped viewports. Run these shots before any shot that
# notifies an incident.
#
# Filter and sort choices are kept in the Django session, and column choices
# and the legend in localStorage — both shared by every shot of a role. Shots
# that change any of them run `fresh`, so the next shot sees the defaults.
#
# Tooltip shots crop with a short viewport rather than an element `selector`:
# the tooltip is drawn outside the element it belongs to and would be cut off.

[[shots]]
name = "images/incident-notification/dashboard-01"
# The Modules menu is no longer rendered on the homepage, so only the tile
# route to the dashboard can be shown.
path = "/"
role = "operator_admin"
annotate = [
  { selector = ".card:has(a[href='/incidents/'])", box = true },
]

[[shots]]
name = "images/incident-notification/dashboard-02"
# The numbers match the list in dashboard.rst. The top-right controls and the
# row icons sit too close together for 90px arrows to clear one another, so
# those labels sit right beside their element (`length = 0`); only the
# callouts with free space around them keep an arrow.
path = "/incidents/"
role = "operator_admin"
viewport = { width = 1440, height = 500 }
annotate = [
  { selector = "a.fw-bold[href='/incidents/']", box = true, arrow = "top", length = 0, label = "1" },
  { selector = "a.btn-primary[href='/incidents/declaration']", box = true, arrow = "top", length = 0, label = "2" },
  { selector = "#search_bar_form", box = true, arrow = "top", length = 0, label = "3" },
  { selector = "#openFilter", box = true, arrow = "top", length = 0, label = "4" },
  { selector = "#ni_legend_btn", box = true, arrow = "top", length = 0, label = "5" },
  { selector = "#incidents-table thead", box = true, arrow = "top", length = 40, label = "6" },
  { selector = "button[data-bs-target='#IncidentshideColumns']", box = true, arrow = "bottom", length = 40, label = "7" },
  { selector = "tr:has(.access_log[data-incident-id='47']) .report_versions", box = true, arrow = "bottom", length = 0, label = "8" },
  { selector = "tr:has(.access_log[data-incident-id='47']) .custom-icon-more-options", box = true, arrow = "bottom", length = 0, label = "9" },
  { selector = "tr:has(.access_log[data-incident-id='47']) a[href^='/incidents/download-pdf/']", box = true, arrow = "bottom", length = 0, label = "10" },
]

[[shots]]
name = "images/incident-notification/dashboard-03"
path = "/incidents/"
role = "operator_admin"
fresh = true
viewport = { width = 1440, height = 440 }
hide = [".tooltip"]
steps = [
  { action = "click", selector = "#ni_legend_btn" },
  { action = "wait_for", selector = "#collapseLegend.show" },
]
annotate = [{ selector = "#collapseLegend", box = true }]

[[shots]]
name = "images/incident-notification/dashboard-04"
# Every column an operator can display, numbered as in the column table of
# dashboard.rst: the four hidden by default (Detection, Start and
# Resolution date, Reference) are ticked in the column choice first. The rows
# are hidden, with the footer they would pull up: with twelve narrow columns,
# the labels would cover their data.
path = "/incidents/"
role = "operator_admin"
fresh = true
viewport = { width = 1440, height = 400 }
hide = ["#incidents-table tbody", "footer"]
steps = [
  { action = "click", selector = "button[data-bs-target='#IncidentshideColumns']" },
