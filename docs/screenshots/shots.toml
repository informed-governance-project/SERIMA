# STATEFUL. Submits the wizard: every run adds two incidents for Operator A,
# one per sector, logged and announced by an opening email each. Nothing
# removes them; reload the fixture to get rid of them. They count towards
# MAX_PRELIMINARY_NOTIFICATION_PER_DAY_PER_USER, past which the wizard sends
# the account back to the list instead of opening.
# The wizard lands on the list, which keeps the search the operator shots above
# left in the session; a fresh login shows it unfiltered.
