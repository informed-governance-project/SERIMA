[[shots]]
name = "images/security-objectives/dashboard-09"
# The operator's log of 107 (Under review): CREATE, READ and SUBMIT, enough to
# show the sort. DataTables lists the newest first and cycles asc → desc →
# unsorted, so the first click clears the sort and the second shows the oldest
# first.
path = "/securityobjectives/"
role = "operator_admin"
selector = "#so_access_log .modal-content"
steps = [
  { action = "click", selector = "tr:has(.so_access_log[data-standard-answer-id='107']) .custom-icon-more-options" },
  { action = "click", selector = ".more-actions-dropdown.show .so_access_log" },
  # The sort control exists only once DataTables has initialised; a click on
  # the header before that is lost.
  { action = "wait_for", selector = "#so_access_log.show #access-log-table th:first-child .dt-column-order" },
  { action = "click", selector = "#access-log-table thead th:first-child" },
  { action = "click", selector = "#access-log-table thead th:first-child" },
  { action = "wait_for", selector = "#access-log-table thead th:first-child[aria-sort='ascending']" },
]

[[shots]]
name = "images/security-objectives/dashboard-07"
# STATEFUL: confirms the duplicate, creating a new Unsubmitted declaration
# (2027, Rail transport) for Operator A plus CREATE and COPY log entries. Keep
# it last in the section: the copy heads the list and pushes 105 and 107 down.
path = "/securityobjectives/"
role = "operator_admin"
viewport = { width = 1440, height = 940 }
steps = [
  { action = "click", selector = "tr:has(.so_access_log[data-standard-answer-id='105']) .copy_so_declaration" },
  { action = "wait_for", selector = "#copy_so_declaration.show #copy-so-declaration-form" },
  { action = "select", selector = "#copy_so_declaration #id_year", value = "2027" },
  { action = "click", selector = "#copy_so_declaration button.multiselect" },
  # Sector groups open collapsed, which leaves their options unclickable.
  { action = "click", selector = "#copy_so_declaration .multiselect-group[title='Transport'] .caret-container" },
  { action = "click", selector = "#copy_so_declaration .multiselect-option:has(input[value='6'])" },
  # Close the sector list: left open, it can cover the Duplicate button.
  { action = "click", selector = "#copy_so_declaration button.multiselect" },
  { action = "click", selector = "#copy-so-declaration-form button[type='submit']" },
  { action = "wait_for", selector = ".alert-success" },
]
annotate = [
  { selector = "#securityobjectives-table tbody tr:nth-child(1)", box = true },
  { selector = "tr:has(.so_access_log[data-standard-answer-id='105'])", box = true },
]

