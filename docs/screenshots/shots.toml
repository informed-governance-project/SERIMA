  { action = "click", selector = "#id_1-regulations_1" },
  { action = "click", selector = "#wizard-next-btn" },
  { action = "click", selector = "#id_2-regulators_0" },
  { action = "click", selector = "#wizard-next-btn" },
  { action = "click", selector = "#sector_12" },
  { action = "click", selector = "#sector_15" },
  { action = "click", selector = "#wizard-next-btn" },
