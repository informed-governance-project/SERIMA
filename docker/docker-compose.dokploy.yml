x-celery-worker: &celery-worker
  build:
    context: ..
    dockerfile: docker/Dockerfile
    no_cache: true
  env_file: .env
  command: worker
  # kaleido's headless chrome orphans two crashpad handlers per launch onto PID 1,
  # which is the celery master here and never reaps them
  init: true
  volumes:
    - ../../files/config/config.py:/app/governanceplatform/config.py:ro
    - theme_data:/app/theme
    - shared_dir:/app/tmp
  restart: unless-stopped
  depends_on:
    - redis
    - db

services:
  web:
    container_name: ${SERIMA_ENVIRONMENT}-serima-web
    build:
      context: ..
      dockerfile: docker/Dockerfile
      no_cache: true
    env_file: .env
    ports:
      - "${APP_PORT:-8888}:8888"
    volumes:
      - ../../files/config/config.py:/app/governanceplatform/config.py:ro
      - ../../files/docker-init.d/:/docker-init.d
      - theme_data:/app/theme
      - shared_dir:/app/tmp
    restart: unless-stopped
    depends_on:
      - theme
      - db
    user: "33:33"

  db:
    image: postgres:18
    container_name: ${SERIMA_ENVIRONMENT}-serima-db
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped

  theme:
    container_name: ${SERIMA_ENVIRONMENT}-serima-theme
    build:
      context: ${THEME_REPO}#${THEME_VERSION}
      dockerfile: docker/Dockerfile
      no_cache: true
    volumes:
      - theme_data:/app/theme
    restart: no

  # One worker per queue, so that report generation never delays a PDF a user is
  # waiting for (see "Splitting the workers" in docs/technical/docker.rst).
  celery-worker-interactive:
    <<: *celery-worker
    container_name: ${SERIMA_ENVIRONMENT}-serima-celery-worker-interactive
    environment:
      CELERY_QUEUES: interactive
      CELERY_CONCURRENCY: ${CELERY_INTERACTIVE_CONCURRENCY:-2}

  celery-worker-reports:
    <<: *celery-worker
    container_name: ${SERIMA_ENVIRONMENT}-serima-celery-worker-reports
    environment:
      CELERY_QUEUES: reports
      CELERY_CONCURRENCY: ${CELERY_REPORTS_CONCURRENCY:-2}

  celery-worker-default:
    <<: *celery-worker
    container_name: ${SERIMA_ENVIRONMENT}-serima-celery-worker-default
    environment:
      CELERY_QUEUES: celery
      CELERY_CONCURRENCY: ${CELERY_DEFAULT_CONCURRENCY:-1}

  celery-beat:
    container_name: ${SERIMA_ENVIRONMENT}-serima-celery-beat
    build:
      context: ..
      dockerfile: docker/Dockerfile
      no_cache: true
    env_file: .env
    command: beat
    volumes:
      - ../../files/config/config.py:/app/governanceplatform/config.py:ro
    restart: unless-stopped
    depends_on:
      - redis
      - db
      - celery-worker-default

  redis:
    container_name: ${SERIMA_ENVIRONMENT}-serima-redis
    image: docker.io/redis:8-alpine
    volumes:
      - ../../files/redis/data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  theme_data:
  shared_dir:
