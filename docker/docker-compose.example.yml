services:
  web:
    container_name: governanceplatform-${SERIMA_ENVIRONMENT?:err}
    image: ${SERIMA_IMAGE:-ghcr.io/informed-governance-project/serima}:${SERIMA_VERSION?:err}
    pull_policy: always
    environment: &env
      DEBUG: "false"
      POSTGRES_USER: "governanceplatform"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD?:err}"
      POSTGRES_DB: "governanceplatform"
      POSTGRES_HOST: "postgres"
      CELERY_BROKER_URL: 'redis://redis:6379/0'
      CELERY_RESULT_BACKEND: 'redis://redis:6379/1'
      SUPERUSER_EMAIL: "${SUPERUSER_EMAIL}" # not set if empty
      SUPERUSER_PASSWORD: "${SUPERUSER_PASSWORD}" # not set if empty
      MAIN_SITE: "${MAIN_SITE}" # not set if empty
      MAIN_SITE_NAME: "${MAIN_SITE_NAME}" # not set if empty
    ports:
      - "${APP_PORT:-8888}:8888"
    volumes:
      - ./volumes/config/config.py:/app/governanceplatform/config.py:ro
      - theme:/app/theme
      - shared_dir:/app/tmp
    restart: unless-stopped
    depends_on:
      - theme
      - db
    user: "33:33"

  db:
    container_name: governanceplatform-postgres-${SERIMA_ENVIRONMENT?:err}
    image: postgres:18
    environment: *env
    restart: unless-stopped
    volumes:
      - ./volumes/postgres/data:/var/lib/postgresql
      # enable the below volume if you want to load a pg_dump at init
      #- ./volumes/postgres/initdb.d:/docker-entrypoint-initdb.d
  theme:
    container_name: governanceplatform-theme-${SERIMA_ENVIRONMENT?:err}
    image: ${THEME_IMAGE:-ghcr.io/informed-governance-project/default-theme}:${THEME_VERSION?:err}
    volumes:
      - theme:/app/theme
    restart: no

  # One worker per queue, so that report generation never delays a PDF a user is waiting
  # for (see "Splitting the workers" in docs/technical/docker.rst). The other two workers
  # reuse this one's definition.
  celery-worker-interactive: &celery-worker
    container_name: governanceplatform-celery-worker-interactive-${SERIMA_ENVIRONMENT?:err}
    image: ${SERIMA_IMAGE:-ghcr.io/informed-governance-project/serima}:${SERIMA_VERSION?:err}
    pull_policy: always
    environment:
      <<: *env
      CELERY_QUEUES: interactive
      CELERY_CONCURRENCY: ${CELERY_INTERACTIVE_CONCURRENCY:-2}
    command: worker
    # kaleido's headless chrome orphans two crashpad handlers per launch onto PID 1,
    # which is the celery master here and never reaps them
    init: true
    volumes:
      - ./volumes/config/config.py:/app/governanceplatform/config.py:ro
      - theme:/app/theme
      - shared_dir:/app/tmp
    restart: unless-stopped
    depends_on:
      - redis
      - db

  celery-worker-reports:
    <<: *celery-worker
    container_name: governanceplatform-celery-worker-reports-${SERIMA_ENVIRONMENT?:err}
    environment:
      <<: *env
      CELERY_QUEUES: reports
      CELERY_CONCURRENCY: ${CELERY_REPORTS_CONCURRENCY:-2}

  celery-worker-default:
    <<: *celery-worker
    container_name: governanceplatform-celery-worker-default-${SERIMA_ENVIRONMENT?:err}
    environment:
      <<: *env
      CELERY_QUEUES: celery
      CELERY_CONCURRENCY: ${CELERY_DEFAULT_CONCURRENCY:-1}

  celery-beat:
    container_name: governanceplatform-celery-beat-${SERIMA_ENVIRONMENT?:err}
    image: ${SERIMA_IMAGE:-ghcr.io/informed-governance-project/serima}:${SERIMA_VERSION?:err}
    pull_policy: always
    environment: *env
    command: beat
    volumes:
      - ./volumes/config/config.py:/app/governanceplatform/config.py:ro
    restart: unless-stopped
    depends_on:
      - redis
      - db
      - celery-worker-default

  redis:
    container_name: governanceplatform-redis-${SERIMA_ENVIRONMENT?:err}
    image: docker.io/redis:8-alpine
    volumes:
      - ./volumes/redis/data:/data
    restart: unless-stopped

volumes:
  theme:
  shared_dir:
