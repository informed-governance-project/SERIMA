<VirtualHost *:80>
    ServerName serima.example.com
    ServerAdmin serima@example.com

    Alias /static /var/www/SERIMA/volumes/static

    ProxyPass /static !

    ProxyPass / http://localhost:8888/ retry=1
    ProxyPassReverse / http://localhost:8888/

    LogLevel warn
    CustomLog ${APACHE_LOG_DIR}/serima_access.log combined
    ErrorLog ${APACHE_LOG_DIR}/serima_error.log
</VirtualHost>
